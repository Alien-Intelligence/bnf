namespace: bnf

# ===========================================================================
# App (Next.js) — the Constituer / Ingérer / Rechercher workspace.
# ===========================================================================
replicaCount: 1

image:
  repository: rg.fr-par.scw.cloud/ns-data-streaming/bnf-demo
  pullPolicy: Always
  tag: "0.15.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# App boots at root `/`; the locale middleware 307-redirects, which counts as a
# probe success (k8s treats any 2xx/3xx as healthy).
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

config:
  # Public hostname the app is served on. BETTER_AUTH_URL and APP_URL both use
  # it; APP_URL is the base for cluster-callback URLs (overridden in-cluster by
  # WORKER_CALLBACK_BASE_URL, set automatically — see configmap.yaml).
  publicUrl: https://bnf.demo.alien.club

  # Ingest path + research RAG path. "real" routes ingestion to the bundled
  # worker (WORKER_RUNNER_URL) and RAG to the data-cluster MCP. "fake" uses the
  # in-process fixtures (no worker, no network) — handy for a UI-only deploy.
  clusterMode: real

  # BnF MCP — corpus building (Constituer). URL is public; token is a secret.
  # Prod BnF gateway MCP (repointed from alpha at the 2026-07-22 data migration).
  bnfMcpUrl: https://bnf.mcp.alien.club/mcp

  # Data-cluster MCP — research RAG (Rechercher), required when clusterMode=real.
  # The research agent's rag_query tool queries this over dataset `bnf-<projectId>`.
  # Prod tenant bnf-corpus-demo-1784645041754 (cluster 113), migrated 2026-07-22.
  dataclusterMcpUrl: https://mcp-bnf-corpus-demo-1784645041754.mcp.alien.club/mcp

  # Langfuse observability — OPTIONAL. Set publicKey here + secretKey in the
  # ExternalSecret to enable per-turn tracing. Leave blank → tracing off.
  langfusePublicKey: "pk-lf-014385ed-18f6-4fa1-84eb-4a7fdc7c7adf"
  langfuseBaseUrl: https://langfuse.alien.club
  # Langfuse project id (the cuid in dashboard URLs). Enables "view in Langfuse"
  # deep-links (admin feedback tab). 1:1 with the public key above.
  langfuseProjectId: "cmqoadeo80003vf07cwn7dfpr"

  # Alien Auth (Authentik) SSO. Base URL + app slug are non-secret (here); the
  # client id/secret are pulled from Scaleway via the ExternalSecret below.
  # Shared with the alien-agents demo (same Authentik application). The OAuth
  # callback `https://bnf.demo.alien.club/api/auth/oauth2/callback/authentik`
  # must be registered on that application or Authentik rejects the flow.
  authentikBaseUrl: https://auth.alien.club
  authentikAppSlug: datastreaming

  # Service name reported to SigNoz. Keep stable across deploys.
  otelServiceName: "bnf-demo-prod"

  # Agent provider — which gateway drives the `claude` agent mode.
  # "anthropic" (default) calls Anthropic with ANTHROPIC_API_KEY; "openrouter"
  # routes turns+tools+MCP through OpenRouter (one key, all vendors — incl. the
  # default model GLM 5.2, which is NOT Anthropic so it ONLY works under
  # openrouter). When openrouter, OPENROUTER_API_KEY MUST be set (pulled via the
  # -app-creds ExternalSecret below) or the app refuses to boot.
  agentProvider: openrouter

# ===========================================================================
# Ingest worker — the major difference from the other demos.
#
# A long-running consumer: it pulls doc-ingest jobs from a pg-boss queue (in
# the bundled Postgres), runs prepare → embed → register against Gallica /
# Scaleway GenAI / RunPod / the data cluster, and serves an HTTP submit API on
# :7777 that the app calls (WORKER_RUNNER_URL). pg-boss row-locks make it safe
# to scale horizontally (worker.replicaCount > 1) — they share one queue.
#
# Active only when config.clusterMode=real. In fake mode set worker.enabled=false.
# ===========================================================================
worker:
  enabled: true
  replicaCount: 1

  image:
    repository: rg.fr-par.scw.cloud/ns-data-streaming/bnf-demo-worker
    pullPolicy: Always
    tag: "0.15.0"

  service:
    type: ClusterIP
    port: 7777

  config:
    # Blob storage — "s3" (Scaleway Object Storage) for real, "local" for debug.
    blobStore: s3
    s3Bucket: bnf-corpus-demo
    s3Endpoint: https://s3.fr-par.scw.cloud
    s3Region: fr-par

    # Scaleway Generative API — primary vision (Holo2). Key is a secret.
    genaiBaseUrl: https://api.scaleway.ai/77c152cc-4d27-4d9b-a449-143df07bcaad/v1
    holoModel: holo2-30b-a3b

    # Google AI — vision provider (primary or fallback per visionPrimary). Key is a secret.
    geminiVisionModel: gemma-4-31b-it
    visionPrimary: holo
    # How long describeViaGemini waits for the `@google/genai` SDK call before
    # giving up (F26, ai-memories/tech/repos/bnf/ingest-hardening — this used to
    # have no bound at all). The SDK takes no AbortSignal, so this only bounds
    # OUR wait; describeImage's caller treats the resulting throw the same as
    # any other provider failure (falls through to the next round/provider).
    geminiTimeoutMs: "60000"

    # OpenRouter — the PRIMARY vision provider (Holo/Gemini are fallbacks). The paid
    # key has no per-key RPM cap, so throughput is bounded only by upstream provider
    # capacity → push concurrency and let the in-call 429/timeout backoff ride the
    # edge. gemini-2.5-flash is FAST (not a reasoning model) — the previous
    # gemma-4-31b-it made describe the pipeline bottleneck (30s+/image). Key is a
    # secret (openrouterApiKeyProperty).
    openrouterVisionModel: google/gemini-2.5-flash
    # Shared cap on in-flight vision API calls across all docs (a doc fans its folios
    # out up to this). Raised 24→64 in hardening-pass-2.
    describeCallConcurrency: "64"
    # DOC-level describe concurrency — how many image docs the describe stage runs at
    # once. Raised 16→32: once fetch hit the 1000/min quota, describe became the slow
    # lane; OpenRouter has no per-key RPM cap so more parallel docs is safe (bounded
    # by describeCallConcurrency across all of them).
    describeConcurrency: "32"
    # Doc-resolution (metadata/OAI) concurrency. Bounded downstream by the broker's
    # external rate (~120/min); 16 keeps that rate fed (was 6).
    metadataConcurrency: "16"
    # Data-cluster register (indexing) concurrency. The cluster autoscales, so push
    # it to drain the register backlog (was 4).
    registerConcurrency: "24"

    # Mistral fallback OCR — transcribes `sans_texte` docs (digitized text, no BnF
    # OCR layer) the librarian opts into. ON: the app already gates the spend
    # (per-ingestion confirmation + the $50/project budget), so any sans_texte doc
    # that reaches the worker is cleared to pay. Key is a secret (mistralApiKeyProperty).
    mistralOcrEnabled: "true"
    mistralOcrModel: mistral-ocr-latest
    mistralOcrMaxPages: "300"
    mistralOcrPollIntervalMs: "5000"
    # Wall-clock ceiling on one batch — MUST stay under the OCR stages' own
    # per-delivery expiration (PipelineStage.expireInSeconds in worker-v2), so a
    # stuck batch fails the doc itself instead of being killed by an expiration
    # (which runs no handler code and orphans the doc).
    mistralOcrBatchTimeoutMs: "1800000"
    # IIIF size requested for OCR-lane folio images. "max" is today's behaviour.
    # F13 sizing-experiment prep (ai-memories/tech/repos/bnf/ingest-hardening):
    # full-res dense 1949 broadsheets are the hypothesized cause of Mistral OCR
    # hallucinating on the Nice-Matin corpus. The live max/pct:50/tiling A-B
    # test runs in the validation phase, not via this default — change it only
    # once that experiment names a winner.
    mistralImageSize: "max"

    # RunPod bge-m3 embedder. Key is a secret.
    runpodEndpointId: pngrbp0y1aj28i
    runpodEmbeddingModel: BAAI/bge-m3

    # Data cluster (register/upsert). Proxy base = backendApiUrl + /clusters/<id>/proxy.
    # bearer token is a secret. clusterId MUST match the dataset region the app's
    # DATACLUSTER_MCP_URL points at.
    backendApiUrl: https://api.alien.club
    clusterId: "113"

    # Gallica politeness / rate-limit knobs (see worker/.env.example).
    gallicaRps: "0.083"
    gallicaBurst: "5"
    gallicaGeneralRps: "8"
    gallicaGeneralBurst: "16"
    viewerOcrConcurrency: "10"
    viewerOcrDelayMs: "40"

    # Ingest reliability. The old ingestJobExpireSeconds / ingestRetryLimit /
    # ingestRetryDelaySeconds lived here and were read by NOTHING in worker-v2 (V1
    # leftovers) — they promised a 4h job ceiling while the real ceiling was
    # pg-boss's silent 15-min default, and a mid-run redeploy then wedged run
    # efe5d747 permanently (F7/F10, ai-memories/tech/repos/bnf/ingest-hardening).
    # Retry + per-delivery expiration now live per stage in code
    # (PipelineStage.retry / .expireInSeconds), each derived from that stage's own
    # worst case; the reconciliation sweep below is the safety net beneath them.
    #
    # Reconciliation sweep: cadence, and how many times ONE doc may be re-driven
    # before it fails as `stranded_after_requeues`. 60s trades a minute of latency
    # on a wedge against two cheap queries per active run.
    reconcilerIntervalMs: "60000"
    reconcilerMaxRequeues: "3"
    # How many consecutive terminal-callback POST failures a run may accumulate
    # (TerminalEmitter.emit's catch path, one failure per sweep re-drive) before
    # the worker gives up and marks it canceled instead of retrying forever.
    # 120 ≈ 2h of sweeps at the 60s cadence above — long enough to ride out a
    # transient app outage, short enough that a permanently-dead callback URL
    # stops spamming the log every sweep. The app-side watchdog independently
    # fails the app job on its own ~30min ceiling, so this is well past that
    # (dead-callback give-up item, ai-memories/tech/repos/bnf/ingest-hardening).
    reconcilerMaxCallbackFailures: "120"
    # Per-folio fetch timeout (ms). 135s sits just ABOVE the broker's 120s upstream
    # timeout so the broker's own classifiable timeout fires first, instead of the
    # worker aborting the broker mid-flight (which logged opaque "operation was
    # aborted"). Under load BnF is slow to serve images; 15s was far too tight.
    bnfPageTimeoutMs: "135000"
    # Metadata (OAI) is fast; a shorter budget is fine.
    bnfMetaTimeoutMs: "45000"
    maxOcrPages: "1000"
    maxImageCanvases: "40"
    imageConcurrency: "3"
    # bnfFetchConcurrency: the worker's single in-flight cap for ALL broker traffic
    # (ALTO/OAI/manifest/images), held below the doc loop so it stays full during
    # embed/index — keeping the broker's rate bucket continuously fed. The broker
    # remains the RATE authority; concurrency is sized ~latency × rate/60 to feed
    # the bucket without over-fetching. BnF's provisioned partner quota is 1000/min
    # (Ludovic, 2026-06-26); broker.config.globalRpm, bnfFetchConcurrency, and
    # bnfGlobalRpm all track that ceiling. To change the quota, bump those together
    # and verify via the broker's /calls.csv (freeze≈0/shed≈0). The worker's own
    # rate gate (bnfGlobalRpm) MUST equal broker globalRpm or it self-throttles.
    bnfGlobalRpm: "1000"
    bnfFetchConcurrency: "128"
    # In-flight doc-jobs. This is the knob that keeps the fetch gate FED: each job
    # runs fetch→embed→index serially in its slot, so at a low value the docs move
    # as a synchronized cohort — fetch bursts to the rate cap, then every job
    # embeds/indexes together (remote RunPod+cluster I/O, ~2-3 min) with fetch idle
    # → sawtooth throughput. 16 desynchronizes the convoy: while some docs
    # embed/index others fetch, so the gate stays fed and throughput holds near the
    # cap. CANNOT over-fetch BnF — bnfFetchConcurrency still caps in-flight fetches
    # regardless. Bound is worker RAM (docs × pages in memory); watch RSS.
    workerConcurrency: "16"

  resources:
    requests:
      cpu: 250m
      # At bnfFetchConcurrency=128 the fetch stage holds up to 128 image Buffers at
      # once (full-res "max" cartes ~10MB) + the vision base64 describe lane. 2Gi
      # OOMKilled. RAM is cheap and the nodes have ~30Gi — provision generously so
      # a full 255-doc run at 128-wide never approaches the ceiling, rather than
      # trimming concurrency to save memory.
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 10Gi

  # The worker drains in-flight jobs on SIGTERM; give it room (a doc can be
  # mid-OCR). Must comfortably exceed a single doc's prepare time, not the full
  # job ceiling.
  terminationGracePeriodSeconds: 120

# ===========================================================================
# BnF broker — the single egress chokepoint for ALL BnF traffic (app metadata
# resolver + ingest worker). Owns the OAuth token (BnF KEY/SECRET live ONLY
# here) and enforces the shared rate caps. When enabled, BNF_BROKER_URL is wired
# into both the app and the worker; both fall back to their direct/relay path if
# it's ever disabled.
#
# ⚠️ The broker runs as EXACTLY ONE replica (hard-pinned in the Deployment, not
# configurable here): its rate buckets + token are in-memory per pod, and the
# per-IP manifest cap requires a single egress IP. Do not try to scale it.
# ===========================================================================
broker:
  enabled: true

  image:
    repository: rg.fr-par.scw.cloud/ns-data-streaming/bnf-demo-broker
    pullPolicy: Always
    tag: "0.15.0"

  service:
    type: ClusterIP
    port: 8792

  config:
    # OAuth client_credentials token endpoint + authenticated partner-API base.
    # apiBaseUrl MUST be openapiproext.bnf.fr (the token'd host). openapi.bnf.fr
    # is the public no-token IIIF mirror (anonymous-per-IP pool, no quota).
    oauthTokenUrl: https://apimauthproext.bnf.fr/oauth2/token
    apiBaseUrl: https://openapiproext.bnf.fr

    # Rate caps (requests/min) — bump here, redeploy the broker only (no
    # app/worker rebuild). global=1000: the REAL provisioned quota (Ludovic raised
    # it 300→1000 on 2026-06-26). The worker's own gate (worker.config.bnfGlobalRpm)
    # must match or it self-throttles below this. manifest raised 12→40/min/IP by BnF.
    globalRpm: "1000"
    manifestRpm: "40"
    externalRpm: "120"

    # Per-attempt upstream timeout to BnF (ms). 120s, not 30s: under ingest load
    # BnF is slow to serve folio images, and a tight abort was the bulk of the
    # transient fetch failures (each abort re-burns the shared quota on retry). The
    # worker's broker-call timeout (BNF_PAGE_TIMEOUT_MS=135s) sits just above this
    # so the broker's own classifiable timeout wins over an opaque worker abort.
    upstreamTimeoutMs: "120000"

  # Adopted from the live deployment (was bumped via `kubectl set resources`
  # during the Gallica ingest load work — provision generously, RAM is cheap;
  # keeping the chart at the old 96Mi/256Mi made every `helm upgrade` fail on
  # an SSA field-ownership conflict with that kubectl-set).
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      # The broker buffers each upstream response WHOLE in memory (server.ts:
      # `Buffer.from(await upstream.arrayBuffer())`) before mirroring it. At
      # worker bnfFetchConcurrency=128 × full-res "max" folio images (~10MB) that
      # is >1GB of concurrent buffers, so 256Mi OOMKilled under ingest load and
      # took the single-replica broker down → every in-flight fetch got
      # ECONNREFUSED. Sized to hold a full 128-wide burst with headroom; drop it
      # only alongside streaming the proxy body instead of buffering it.
      memory: 2Gi

# ===========================================================================
# Bundled Postgres — single replica, PVC-backed, no replication. Shared by the
# app (domain tables + better-auth) and the worker (pg-boss queue, own schema).
# Fine for a demo; not for real production data.
# ===========================================================================
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: bnf_demo
  username: bnf_demo
  # Password generated once and preserved across upgrades (see postgres-secret.yaml).
  port: 5432
  persistence:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # storageClassName: leave unset to use the cluster default (sbs-default on Scaleway)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ===========================================================================
# Istio ingress. bnf.demo.alien.club is a dedicated subdomain served at root
# (no basePath / URI rewrite), so the chart provisions its OWN Gateway +
# cert-manager Certificate. Requires DNS bnf.demo.alien.club → istio ingress
# and the `letsencrypt` ClusterIssuer.
# ===========================================================================
istio:
  hosts:
    - host: bnf.demo.alien.club
      path: /
      gateway: own

  gatewayNamespace: istio-system
  # REQUIRED only if any host uses `gateway: shared`. Name of an existing Istio
  # Gateway already serving the host. Discover with:
  #   kubectl get vs -A -o wide | grep <host>
  sharedGatewayName: ""

  gateway:
    # Required true if any host uses `gateway: own`. Provisions a Gateway
    # covering the `own` hosts (port 80 for ACME HTTP-01 + 443 TLS).
    create: true

  virtualService:
    enabled: true
    # Both null on purpose — the agent streams SSE for the full duration of a
    # turn (a finite timeout would chop long answers), and POST /api/.../messages
    # has side effects (creates rows, starts a run) so auto-retry would duplicate.
    # Istio rejects "0s" but treats an absent field as "no limit / no retries".
    timeout: null
    retries: null

  certificate:
    # Required true if any host uses `gateway: own`. Issues a Certificate
    # covering all `own` hosts and mounts it as the Gateway's TLS credential.
    enabled: true
    issuerName: letsencrypt

# ===========================================================================
# Secrets — pulled from Scaleway Secret Manager via external-secrets. One
# remote secret holds all real credentials as properties; each property below
# maps to one env var. Leave a property name blank to skip that key.
# ===========================================================================
secrets:
  # Name of the Scaleway Secret Manager secret holding every credential below.
  scalewaySecretName: bnf-demo-prod

  # --- App credentials ---
  anthropicApiKeyProperty: ANTHROPIC_API_KEY
  bnfMcpTokenProperty: BNF_MCP_TOKEN
  # data-cluster bearer (RAG via datacluster MCP); shared with the worker.
  clusterBearerTokenProperty: CLUSTER_BEARER_TOKEN
  # Optional — only consumed if config.langfusePublicKey is set.
  langfuseSecretKeyProperty: LANGFUSE_SECRET_KEY
  # OpenRouter API key — only pulled when config.agentProvider == "openrouter".
  openrouterApiKeyProperty: OPENROUTER_API_KEY

  # --- Alien Auth (Authentik) SSO credentials ---
  # AUTHENTIK_CLIENT_ID / AUTHENTIK_CLIENT_SECRET live in a SHARED Scaleway
  # secret (`authentik-prod`), NOT the per-demo `bnf-demo-prod` secret — the
  # same OAuth application is reused across all demos (openaire, agents, bnf).
  # Pulled into a dedicated ExternalSecret and projected via envFrom only when
  # config.authentikBaseUrl is set. Mirrors the openaire-chart pattern.
  authentikScalewaySecretName: authentik-prod

  # --- Worker credentials ---
  scwS3AccessKeyProperty: SCW_S3_ACCESS_KEY
  scwS3SecretKeyProperty: SCW_S3_SECRET_KEY
  scwApiKeyProperty: SCW_API_KEY
  googleAiApiKeyProperty: GOOGLE_AI_API_KEY
  runpodApiKeyProperty: RUNPOD_API_KEY
  # Mistral fallback OCR for `sans_texte` docs (worker only). Held by the worker.
  mistralApiKeyProperty: MISTRAL_API_KEY

  # --- BnF broker credentials (OAuth client_credentials) ---
  # The BnF KEY/SECRET live ONLY behind the broker. Both properties must exist
  # on the `bnf-demo-prod` Scaleway secret.
  bnfClientKeyProperty: BNF_CLIENT_KEY
  bnfClientSecretProperty: BNF_CLIENT_SECRET

podAnnotations:
  # OTel Node.js auto-instrumentation sidecar (Instrumentation CR in signoz ns).
  instrumentation.opentelemetry.io/inject-nodejs: "signoz/signoz-instrumentation"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
