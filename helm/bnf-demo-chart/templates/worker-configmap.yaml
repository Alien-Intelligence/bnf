{{- if and .Values.worker.enabled (eq .Values.config.clusterMode "real") }}
{{- include "bnf-demo.validateRates" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bnf-demo.fullname" . }}-worker-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnf-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  # --- Blob storage ---
  BLOB_STORE: {{ .Values.worker.config.blobStore | quote }}
  SCW_S3_BUCKET: {{ .Values.worker.config.s3Bucket | quote }}
  SCW_S3_ENDPOINT_URL: {{ .Values.worker.config.s3Endpoint | quote }}
  SCW_S3_REGION: {{ .Values.worker.config.s3Region | quote }}

  # --- Scaleway GenAI / Holo2 (primary vision) ---
  SCW_GENAI_BASE_URL: {{ .Values.worker.config.genaiBaseUrl | quote }}
  HOLO_MODEL: {{ .Values.worker.config.holoModel | quote }}

  # --- Google AI (vision provider) ---
  GEMINI_VISION_MODEL: {{ .Values.worker.config.geminiVisionModel | quote }}
  VISION_PRIMARY: {{ .Values.worker.config.visionPrimary | quote }}
  # Bound on the Gemini SDK's generateContent call (F26, ai-memories/tech/repos/bnf/ingest-hardening).
  GEMINI_TIMEOUT_MS: {{ .Values.worker.config.geminiTimeoutMs | quote }}

  # --- OpenRouter (primary vision provider) ---
  # The API key is a secret (worker-creds: OPENROUTER_API_KEY).
  OPENROUTER_VISION_MODEL: {{ .Values.worker.config.openrouterVisionModel | quote }}
  # Shared in-flight cap on vision API calls across all docs (the describe lane).
  DESCRIBE_CALL_CONCURRENCY: {{ .Values.worker.config.describeCallConcurrency | quote }}
  # Doc-level describe concurrency — how many image docs describe at once.
  DESCRIBE_CONCURRENCY: {{ .Values.worker.config.describeConcurrency | quote }}
  # Doc-resolution (metadata/OAI) concurrency — fed by the broker's external rate.
  METADATA_CONCURRENCY: {{ .Values.worker.config.metadataConcurrency | quote }}
  # Data-cluster register (indexing) concurrency — the cluster autoscales.
  REGISTER_CONCURRENCY: {{ .Values.worker.config.registerConcurrency | quote }}
{{- if .Values.worker.config.mistralOcrEnabled }}

  # --- Mistral fallback OCR (`sans_texte` docs) ---
  # The API key is a secret (worker-creds: MISTRAL_API_KEY).
  MISTRAL_OCR_ENABLED: {{ .Values.worker.config.mistralOcrEnabled | quote }}
  MISTRAL_OCR_MODEL: {{ .Values.worker.config.mistralOcrModel | quote }}
  MISTRAL_OCR_MAX_PAGES: {{ .Values.worker.config.mistralOcrMaxPages | quote }}
  MISTRAL_OCR_POLL_INTERVAL_MS: {{ .Values.worker.config.mistralOcrPollIntervalMs | quote }}
  MISTRAL_OCR_BATCH_TIMEOUT_MS: {{ .Values.worker.config.mistralOcrBatchTimeoutMs | quote }}
{{- end }}

  # --- RunPod embedder ---
  RUNPOD_EMBEDDING_ENDPOINT_ID: {{ .Values.worker.config.runpodEndpointId | quote }}
  RUNPOD_EMBEDDING_MODEL: {{ .Values.worker.config.runpodEmbeddingModel | quote }}

  # --- Data cluster (register) ---
  BACKEND_API_URL: {{ .Values.worker.config.backendApiUrl | quote }}
  CLUSTER_ID: {{ .Values.worker.config.clusterId | quote }}

  # --- BnF broker (REQUIRED) ---
  # ALL BnF traffic (OCR/manifest/metadata) goes through the broker — it owns
  # the OAuth token + shared rate caps. The worker REFUSES TO BOOT without a
  # valid URL (no fallback path): the chart's own broker when enabled, else
  # worker.config.bnfBrokerUrl, which the render requires.
{{- if .Values.broker.enabled }}
  BNF_BROKER_URL: {{ include "bnf-demo.brokerInternalUrl" . | quote }}
{{- else }}
  BNF_BROKER_URL: {{ required "worker.config.bnfBrokerUrl is required when broker.enabled is false: the worker refuses to boot without BNF_BROKER_URL" .Values.worker.config.bnfBrokerUrl | quote }}
{{- end }}

  # --- Worker HTTP API ---
  WORKER_HTTP_PORT: {{ .Values.worker.service.port | quote }}
  # Callback host allow-list: the worker rejects any callbackUrl whose host
  # doesn't match this. Must equal the app's WORKER_CALLBACK_BASE_URL.
  APP_BASE_URL: {{ include "bnf-demo.appInternalUrl" . | quote }}

  # --- Gallica rate limiting ---
  GALLICA_RPS: {{ .Values.worker.config.gallicaRps | quote }}
  GALLICA_BURST: {{ .Values.worker.config.gallicaBurst | quote }}
  GALLICA_GENERAL_RPS: {{ .Values.worker.config.gallicaGeneralRps | quote }}
  GALLICA_GENERAL_BURST: {{ .Values.worker.config.gallicaGeneralBurst | quote }}

  # --- BnF IIIF APIs (REQUIRED: the worker refuses to boot without them) ---
  # Manifests + ALTO on the Presentation API, images on the Image API.
  BNF_IIIF_PRESENTATION_BASE_URL: {{ required "bnfIiif.presentationBaseUrl is required" .Values.bnfIiif.presentationBaseUrl | quote }}
  BNF_IIIF_IMAGE_BASE_URL: {{ required "bnfIiif.imageBaseUrl is required" .Values.bnfIiif.imageBaseUrl | quote }}

  # --- The worker's BnF gates (REQUIRED) — the SAME values as the broker's
  # buckets (broker.config.rates), so the two cannot drift. ALTO = presentation
  # ∧ global, images = image ∧ global, manifests = manifest ∧ presentation ∧
  # global (worker-v2/src/main.ts).
  BNF_GLOBAL_RPM: {{ include "bnf-demo.rateField" (dict "root" . "bucket" "global" "field" "rpm") | quote }}
  BNF_PRESENTATION_RPM: {{ include "bnf-demo.rateField" (dict "root" . "bucket" "presentation" "field" "rpm") | quote }}
  BNF_IMAGE_RPM: {{ include "bnf-demo.rateField" (dict "root" . "bucket" "image" "field" "rpm") | quote }}
  BNF_MANIFEST_RPM: {{ include "bnf-demo.rateField" (dict "root" . "bucket" "manifest" "field" "rpm") | quote }}
  # In-flight fetches per stage (REQUIRED) — see values.yaml for the sizing.
  BNF_ALTO_FETCH_CONCURRENCY: {{ required "worker.config.altoFetchConcurrency is required" .Values.worker.config.altoFetchConcurrency | quote }}
  BNF_IMAGE_FETCH_CONCURRENCY: {{ required "worker.config.imageFetchConcurrency is required" .Values.worker.config.imageFetchConcurrency | quote }}

  # --- BnF fetch timeouts ---
  # Per-folio fetch budget. 135s sits just ABOVE the broker's 120s upstream timeout
  # so the broker's classifiable timeout fires first (not an opaque worker abort).
  BNF_PAGE_TIMEOUT_MS: {{ .Values.worker.config.bnfPageTimeoutMs | quote }}
  BNF_META_TIMEOUT_MS: {{ .Values.worker.config.bnfMetaTimeoutMs | quote }}

  # --- Ingest reliability ---
  # NOTE: INGEST_JOB_EXPIRE_SECONDS / INGEST_RETRY_LIMIT / INGEST_RETRY_DELAY_SECONDS
  # used to be set here and configured NOTHING — worker-v2 has no reader for them
  # (V1 leftovers). They implied a 4h job ceiling while the real one was pg-boss's
  # silent 15-min default, which is how a run wedged (F7/F10,
  # ai-memories/tech/repos/bnf/ingest-hardening). Retry + per-delivery expiration
  # are now declared per STAGE in code (PipelineStage.retry / .expireInSeconds),
  # deliberately not env-tunable: each ceiling is derived from that stage's own
  # worst-case wall clock, not from an operator's guess.
  MAX_OCR_PAGES: {{ .Values.worker.config.maxOcrPages | quote }}

  # --- OCR-quality backfill ---
  # Per-ARK OCR-quality artifacts for documents indexed before the feature. One
  # Presentation (ALTO) call per indexed text folio, once, behind the shared
  # ALTO gate. See values.yaml's comment and helm/DEPLOY.md "OCR quality backfill".
  OCR_BACKFILL_ENABLED: {{ .Values.worker.config.ocrBackfillEnabled | quote }}
  OCR_BACKFILL_CONCURRENCY: {{ .Values.worker.config.ocrBackfillConcurrency | quote }}
  OCR_BACKFILL_RETRY_FAILED_AFTER_MS: {{ .Values.worker.config.ocrBackfillRetryFailedAfterMs | quote }}

  # --- Reconciliation sweep ---
  # The periodic re-drive of docs whose queue job vanished (pg-boss expiration, a
  # pod killed mid-delivery) + the re-check of every run the app still waits on.
  # This is what makes a mid-run redeploy self-healing instead of a permanent
  # wedge; see worker-v2/src/live/reconciler.ts.
  RECONCILER_INTERVAL_MS: {{ .Values.worker.config.reconcilerIntervalMs | quote }}
  # Re-drives allowed per doc before it fails as `stranded_after_requeues` — a
  # poisoned doc must stop consuming quota AND stop blocking its run.
  RECONCILER_MAX_REQUEUES: {{ .Values.worker.config.reconcilerMaxRequeues | quote }}
  # Consecutive terminal-callback POST failures before the emitter gives up on
  # a run and cancels it (dead-callback give-up item,
  # ai-memories/tech/repos/bnf/ingest-hardening) — otherwise a permanently-dead
  # callback URL gets re-driven by every sweep forever.
  RECONCILER_MAX_CALLBACK_FAILURES: {{ .Values.worker.config.reconcilerMaxCallbackFailures | quote }}
{{- end }}
