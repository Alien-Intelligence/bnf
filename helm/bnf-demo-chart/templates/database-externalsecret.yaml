{{- if eq (include "bnf-demo.postgresMode" .) "external" }}
{{- /*
External mode: the managed instance's password and CA come from their own
Scaleway secret (postgres.external.scalewaySecretName), kept apart from the
app credentials so provisioning the database never re-versions them. The
DATABASE_URL is assembled here from that password and the non-secret values.

TLS: sslmode=verify-ca with uselibpqcompat=true checks the server against the
instance's own CA (its certificate is self-signed per instance). verify-full
cannot work: the certificate names only the private IP, and node-postgres
checks an IP host against "localhost". The Prisma CLI (`migrate deploy` at
boot) ignores sslrootcert: it encrypts but does not verify the certificate.
*/}}
{{- $store := "scaleway-secret-manager" }}
{{- $ext := .Values.postgres.external }}
{{- $remote := printf "name:%s" (required "postgres.external.scalewaySecretName is required in external mode" $ext.scalewaySecretName) }}
{{- $host := include "bnf-demo.databaseHost" . }}
{{- $port := include "bnf-demo.databasePort" . }}
{{- $user := include "bnf-demo.databaseUser" . }}
{{- $db := required "postgres.external.database is required in external mode" $ext.database }}
{{- $caPath := printf "%s/ca.pem" (include "bnf-demo.databaseCaDir" .) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bnf-demo.databaseSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bnf-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ include "bnf-demo.databaseSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: {{ printf "postgres://%s:{{ .password | urlquery }}@%s:%s/%s?uselibpqcompat=true&sslmode=verify-ca&sslrootcert=%s" $user $host $port $db $caPath | quote }}
        ca.pem: {{ "{{ .ca }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $remote }}
        property: {{ required "postgres.external.passwordProperty is required in external mode" $ext.passwordProperty }}
      sourceRef:
        storeRef:
          name: {{ $store }}
          kind: ClusterSecretStore
    - secretKey: ca
      remoteRef:
        key: {{ $remote }}
        property: {{ required "postgres.external.caProperty is required in external mode" $ext.caProperty }}
      sourceRef:
        storeRef:
          name: {{ $store }}
          kind: ClusterSecretStore
{{- end }}
