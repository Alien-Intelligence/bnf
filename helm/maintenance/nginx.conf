# Serves the maintenance page for ALL paths with a proper 503 + Retry-After, so
# monitors read "planned maintenance", not "outage". Unprivileged nginx → :8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Readiness endpoint — returns 200 so k8s marks the pod ready (the maintenance
    # page itself deliberately returns 503, which a probe would treat as failure).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        add_header Retry-After 120 always;
        error_page 503 /index.html;
        return 503;
    }

    # Serve the body for the internal 503 redirect.
    location = /index.html {
        internal;
        add_header Retry-After 120 always;
    }
}
